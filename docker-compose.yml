# qc-platform — Docker Compose
# 一次拉起（推荐）:
#   cp .env.example .env
#   docker compose up --build -d
# 查看状态: docker compose ps
# 日志:     docker compose logs -f
# 停止:     docker compose down          # 保留命名 volume，数据不丢
# 销毁数据: docker compose down -v       # 慎用：会删 mysql_data
#
# api 为 FastAPI 质检服务（uvicorn 启动，经 qc-net 用主机名 db 连库）；db 为 MySQL 8。

services:
  db:
    image: mysql:8
    container_name: qc-platform-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      # 仅本地调试需要时映射；生产可去掉 host 端口
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 命名 volume：容器重启 / compose down（不加 -v）数据不丢
      - mysql_data:/var/lib/mysql
      # 后端落地后可挂载初始化脚本：
      # - ./db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - qc-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qc-platform-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      QC_DEMO_SLEEP: "0"
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RULES_VERSION: ${RULES_VERSION:-v1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 只读挂载 ./data 作为演示数据集；源码不挂载，改代码后需 docker compose up -d --build api
    networks:
      - qc-net
    # TODO: 为 api 增加 healthcheck（探 GET /health）

  redis:
    image: redis:7
    container_name: qc-platform-redis
    restart: unless-stopped
    ports:
      # 仅本地调试需要时映射到宿主机；容器之间走 qc-net 内的 6379，不依赖这个映射
      - "${REDIS_HOST_PORT:-6379}:6379"
    # 不给 volume：缓存丢了能从 MySQL 重建，重启即空正好符合「Redis 是副本不是正源」
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - qc-net

volumes:
  mysql_data:
    name: qc-platform-mysql-data

networks:
  qc-net:
    name: qc-platform-net
